name: Update KeeperIQ data

on:
  schedule:
    # Daily during the MLS season window (roughly Feb–Dec). Harmless off-season:
    # the pipeline still validates and only commits when source data changes.
    - cron: "15 14 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keeperiq-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch data and rebuild artefacts
        run: PYTHONPATH=pipeline/src python -m keeperiq.cli --force

      - name: Pipeline lint
        run: ruff check pipeline/src pipeline/tests

      - name: Pipeline tests
        run: pytest pipeline/tests -q

      - name: Frontend lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Commit updated data when the source changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # Do not use [skip ci]: Vercel (and similar) ignore those commits, so the
          # live site would stop redeploying when data refreshes. This workflow only
          # runs on schedule / workflow_dispatch, so a data push will not re-trigger it.
          commit_message: "chore(data): refresh MLS KeeperIQ snapshot"
          file_pattern: public/data/** data/processed/** data/snapshots/**
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
